name: Build LazyRehab APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore" debug.keystore

          restore_and_verify() {
            local src_cmd="$1"
            local tmp_ks
            tmp_ks=$(mktemp)
            if eval "$src_cmd" | tr -d '[:space:]' | base64 -d > "$tmp_ks" 2>/dev/null; then
              if keytool -list -keystore "$tmp_ks" -storepass android >/dev/null 2>&1; then
                mv "$tmp_ks" "$HOME/.android/debug.keystore"
                cp "$HOME/.android/debug.keystore" debug.keystore
                echo "Restored and verified valid debug.keystore."
                return 0
              fi
            fi
            rm -f "$tmp_ks"
            return 1
          }

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            if ! restore_and_verify "printf '%s' \"\$DEBUG_KEYSTORE_BASE64\""; then
              echo "Warning: DEBUG_KEYSTORE_BASE64 is not a valid keystore; removed broken file."
            fi
          elif [ -f debug.keystore.base64 ]; then
            if ! restore_and_verify "cat debug.keystore.base64"; then
              echo "Warning: debug.keystore.base64 is not a valid keystore; removed broken file."
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Print APK signing cert SHA-256 and keystore base64
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            ANDROID_HOME_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
            APKSIGNER=$(find "$ANDROID_HOME_DIR/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true
            fi
          fi
          if [ -f "$HOME/.android/debug.keystore" ]; then
            echo "=== KEYSTORE_BASE64 ==="
            base64 -w 0 "$HOME/.android/debug.keystore"
            echo ""
            echo "=== END_KEYSTORE_BASE64 ==="
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LazyRehab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
